# Reiter „Foto → Daten“: Vorlagen (welche Angaben gelesen werden) und
# Beispielfotos mit Musterlösung. Die Fotos sind ausgedacht und erzeugt
# (tools/beispielfotos_erzeugen.py), alle Firmen sind fiktiv.
#
# Feldtypen fuer die Bewertung:
#   text     tolerant verglichen (Gross-/Kleinschreibung, Leerzeichen, kleine Abweichungen)
#   betrag   Zahl, auf den Cent genau („52,10“ = 52.1)
#   zahl     Zahl, auf 0,01 genau
#   datum    Tag und Monat muessen stimmen, das Jahr nur, wenn beide eines haben
#   uhrzeit  Stunde und Minute
#   kennung  Nummern und Codes: nur Buchstaben und Ziffern zaehlen, muss exakt stimmen

vorlagen:
  - id: beleg
    titel: "Kassenbon oder Rechnung"
    felder:
      - { name: haendler, label: "Händler", typ: text }
      - { name: datum, label: "Datum", typ: datum }
      - { name: uhrzeit, label: "Uhrzeit", typ: uhrzeit }
      - { name: summe, label: "Summe brutto (EUR)", typ: betrag }
      - { name: mwst_satz, label: "MwSt-Satz (%)", typ: zahl }
      - { name: mwst_betrag, label: "MwSt-Betrag (EUR)", typ: betrag }
      - { name: zahlart, label: "Zahlart", typ: text }
      - { name: belegnummer, label: "Bon- oder Rechnungsnummer", typ: kennung }
    liste:
      name: positionen
      label: "Positionen"
      felder:
        - { name: bezeichnung, label: "Bezeichnung", typ: text }
        - { name: menge, label: "Menge", typ: zahl }
        - { name: einzelpreis, label: "Einzelpreis", typ: betrag }
        - { name: gesamt, label: "Gesamt", typ: betrag }

  - id: lieferschein
    titel: "Lieferschein"
    felder:
      - { name: lieferant, label: "Lieferant", typ: text }
      - { name: kunde, label: "Kunde (Firma)", typ: text }
      - { name: lieferschein_nr, label: "Lieferschein-Nr.", typ: kennung }
      - { name: datum, label: "Datum", typ: datum }
      - { name: bestellnummer, label: "Bestellnummer des Kunden", typ: kennung }
      - { name: kundennummer, label: "Kundennummer", typ: kennung }
    liste:
      name: positionen
      label: "Positionen"
      felder:
        - { name: artikelnummer, label: "Artikel-Nr.", typ: kennung }
        - { name: bezeichnung, label: "Bezeichnung", typ: text }
        - { name: menge, label: "Menge", typ: zahl }
        - { name: einheit, label: "Einheit", typ: text }

  - id: typenschild
    titel: "Typenschild"
    felder:
      - { name: hersteller, label: "Hersteller", typ: text }
      - { name: typ, label: "Typ", typ: kennung }
      - { name: seriennummer, label: "Seriennummer", typ: kennung }
      - { name: baujahr, label: "Baujahr", typ: zahl }
      - { name: leistung_kw, label: "Leistung (kW)", typ: zahl }
      - { name: spannung_v, label: "Spannung (V)", typ: zahl }
      - { name: strom_a, label: "Strom (A)", typ: zahl }
      - { name: frequenz_hz, label: "Frequenz (Hz)", typ: zahl }
      - { name: drehzahl, label: "Drehzahl (1/min)", typ: zahl }
      - { name: schutzart, label: "Schutzart (z. B. IP54)", typ: kennung }
      - { name: gewicht_kg, label: "Gewicht (kg)", typ: zahl }
      - { name: wirkungsgrad, label: "Wirkungsgrad (%)", typ: zahl }

  - id: protokoll
    titel: "Whiteboard oder Notizzettel"
    felder:
      - { name: titel, label: "Überschrift", typ: text }
      - { name: datum, label: "Datum", typ: datum }
      - { name: naechster_termin_datum, label: "Nächster Termin, Datum", typ: datum }
      - { name: naechster_termin_uhrzeit, label: "Nächster Termin, Uhrzeit", typ: uhrzeit }
    liste:
      name: aufgaben
      label: "Aufgaben"
      felder:
        - { name: was, label: "Was", typ: text }
        - { name: wer, label: "Wer", typ: text }
        - { name: bis, label: "Bis", typ: datum }

