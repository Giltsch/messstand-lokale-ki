[project]
name = "messstand"
version = "0.1.0"
description = "Messstand: lokale KI vergleichen (MDZ-Workshop)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Behninger" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "pypdf>=5.1",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.12",
    "markdown>=3.5",
    "nh3>=0.2",
]

[project.optional-dependencies]
docling = ["docling>=2.15"]

[project.scripts]
messstand = "messstand.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messstand"]
