station:
  name: "Station 3: Die Maschine für viele"
  geraet: "DGX Spark, 128 GB, DGX OS (ARM64)"
  speicher_gb: 128
  bandbreite_gbs: 273

backends:
  - id: ollama
    label: "Ollama, GGUF (llama.cpp)"
    typ: ollama
    url: http://127.0.0.1:11434
    # Neben vLLM (25 % des Speichers) bleiben Ollama rund 81 GiB. GPT-OSS 120B
    # belegt geladen etwa 65 GB. Passt ein Modell nicht mehr hinein, entlaedt
    # der Messstand vorher das am laengsten nicht benutzte.
    speicher_budget_gb: 80
    modelle:
      # Dieselben Tags und Beschriftungen wie Station 1 und 2, damit die
      # Ergebnisse der Stationen direkt nebeneinander passen.
      - id: gemma4:e2b-it-qat
        label: "Gemma 4 E2B, QAT, GGUF"
        architektur: dense
        parameter_gesamt_mrd: 5
        parameter_aktiv_mrd: 2
        groesse_gb: 4.3
      - id: gemma4:e4b-it-q4_K_M
        label: "Gemma 4 E4B, 4 Bit (Q4_K_M), GGUF"
        architektur: dense
        parameter_gesamt_mrd: 8
        parameter_aktiv_mrd: 4.5
        groesse_gb: 6.6
      - id: gemma4:e4b-it-q8_0
        label: "Gemma 4 E4B, 8 Bit (Q8_0), GGUF"
        architektur: dense
        parameter_gesamt_mrd: 8
        parameter_aktiv_mrd: 4.5
        groesse_gb: 9.0
      - id: gemma4:e4b-it-bf16
        label: "Gemma 4 E4B, 16 Bit (BF16), GGUF"
        architektur: dense
        parameter_gesamt_mrd: 8
        parameter_aktiv_mrd: 4.5
        groesse_gb: 16
      - id: gemma4:26b-a4b-it-q4_K_M
        label: "Gemma 4 26B A4B, MoE, 4 Bit"
        architektur: moe
        parameter_gesamt_mrd: 26
        parameter_aktiv_mrd: 4
        groesse_gb: 17
      - id: gemma4:31b-it-q4_K_M
        label: "Gemma 4 31B, dense, 4 Bit"
        architektur: dense
        parameter_gesamt_mrd: 31
        parameter_aktiv_mrd: 31
        groesse_gb: 20
      - id: gpt-oss:120b
        label: "GPT-OSS 120B, MoE (passt auf 32 GB nicht)"
        architektur: moe
        parameter_gesamt_mrd: 120
        parameter_aktiv_mrd: 5.1
        groesse_gb: 65
  # vLLM: nvidia/Gemma-4-26B-A4B-NVFP4, ausgeliefert unter dem Namen unten
  # (siehe --served-model-name in spark/vllm-starten.sh).
  - id: vllm
    label: "vLLM"
    typ: openai
    url: http://127.0.0.1:8000/v1
    modelle:
      - id: google/gemma-4-26b-a4b-it
        label: "Gemma 4 26B A4B, vLLM, NVFP4"
        architektur: moe
        parameter_gesamt_mrd: 26
        parameter_aktiv_mrd: 4
        groesse_gb: 19

embedding:
  typ: ollama
  url: http://127.0.0.1:11434
  modell: embeddinggemma

parser: [naiv, schnell, strukturiert]

vergleiche:
  # Beide 4 Bit, derselbe MoE, nur eine andere Laufzeit.
  - name: "Ollama gegen vLLM"
    a: { backend: ollama, modell: gemma4:26b-a4b-it-q4_K_M }
    b: { backend: vllm,   modell: google/gemma-4-26b-a4b-it }
  # Dieselben Paarungen wie auf dem Mac mini. Hier passen beide Seiten
  # gleichzeitig in den Speicher.
  - name: "Dense gegen MoE"
    a: { backend: ollama, modell: gemma4:31b-it-q4_K_M }
    b: { backend: ollama, modell: gemma4:26b-a4b-it-q4_K_M }
  - name: "Acht Bit gegen sechzehn Bit"
    a: { backend: ollama, modell: gemma4:e4b-it-q8_0 }
    b: { backend: ollama, modell: gemma4:e4b-it-bf16 }
  - name: "Vier Bit gegen acht Bit"
    a: { backend: ollama, modell: gemma4:e4b-it-q8_0 }
    b: { backend: ollama, modell: gemma4:e4b-it-q4_K_M }
  - name: "Vier Bit gegen sechzehn Bit"
    a: { backend: ollama, modell: gemma4:e4b-it-bf16 }
    b: { backend: ollama, modell: gemma4:e4b-it-q4_K_M }
  # 120 gegen 26 Milliarden Parameter, aber fast gleich viele aktive.
  - name: "Großer MoE gegen kleinen MoE"
    a: { backend: ollama, modell: gpt-oss:120b }
    b: { backend: ollama, modell: gemma4:26b-a4b-it-q4_K_M }

lasttest:
  erlaubt: true
  stufen: [1, 4, 8, 15]
  standard: 15
  hinweis_parallelitaet: "Ollama läuft hier mit OLLAMA_NUM_PARALLEL=8, vLLM plant Anfragen selbst ein."

# Eigenes OCR-Werkzeug (KILaw/LawAI), läuft als systemd-Dienst lawai-app.
# Nur im Modus „ocr“ von spark/spark-modus.sh erreichbar. Gezeigt werden nur
# diese Beispiele und Dateien, die über den Messstand hochgeladen wurden;
# andere (interne) Dokumente im OCR-Werkzeug bleiben unsichtbar.
ocr:
  url: http://127.0.0.1:8080
  passwort_datei: ~/.config/lawai/env
  beispiele:
    - datei: "827-9999-903 rev c.pdf"
      titel: "Technische Zeichnung"
      zeigt: "Großformat in Kacheln, Notizen und Schriftfeld sicher, Maßsymbole an der Grenze"
    - datei: "handschrift-scads-032.jpg"
      titel: "Handschrift, gut lesbar"
      zeigt: "Zweitleser springt ein, liest fast alles, gibt aber trotzdem nicht allein frei"
      quelle: "ScaDS.AI German Full-Page Handwriting Dataset, Seite 032 (Burghardt, Nestler), CC BY 4.0, doi:10.5281/zenodo.18283705"
    - datei: "handschrift-scads-066.jpg"
      titel: "Handschrift, schwierig"
      zeigt: "Hier liegt die Grenze: Krakelschrift, viele uneinige Stellen"
      quelle: "ScaDS.AI German Full-Page Handwriting Dataset, Seite 066 (Burghardt, Nestler), CC BY 4.0, doi:10.5281/zenodo.18283705"
    - datei: "Kuendigung_Weber_Scan.png"
      titel: "Gescannter Brief"
      zeigt: "Normalfall: wird ohne Mensch freigegeben, Fristen und Daten erkannt"
    - datei: "aktenstapel.pdf"
      titel: "Stapel mit 21 Seiten"
      zeigt: "Durchsatz: viele Seiten gleichzeitig"
    - datei: "lf_a3_spread.png"
      titel: "A3-Doppelseite"
      zeigt: "Seite größer als das Modell sie sehen kann, wird zerlegt und wieder zusammengesetzt"

# Spracherkennung für den Reiter „Sprache“: spark/whisper-starten.sh (Port 8002),
# am einfachsten über spark/spark-modus.sh sprache (Whisper plus GPT-OSS 120B).
sprache:
  url: http://127.0.0.1:8002/v1
  modell: openai/whisper-large-v3-turbo
  label: "Whisper large-v3-turbo (OpenAI, MIT-Lizenz)"
  sprache: de
  # Sprecher unterscheiden: spark/sprecher_dienst.py (NVIDIA TitaNet, Port 8003)
  sprecher_url: http://127.0.0.1:8003
